version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    # Bound to loopback only — reachable as localhost:8000 on this machine
    # (for direct testing), but not from the public internet. Publishing on
    # 0.0.0.0 let anyone bypass Caddy and spoof X-Forwarded-For to defeat
    # the rate limiter (app/rate_limit.py trusts that header unconditionally).
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: