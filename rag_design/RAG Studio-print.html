<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAG Studio — Conversation (print)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css" />
  <style>
    /* Print-ready overrides: force a fixed landscape canvas, force colors,
       suppress hover/animations, expand sources, hide Tweaks panel. */
    @page { size: 1400px 900px; margin: 0; }

    html, body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Lock the app to a fixed landscape canvas regardless of preview size */
    body { width: 1400px; height: 900px; overflow: hidden; }
    .app { width: 1400px !important; height: 900px !important; }

    /* Hide the Tweaks panel + its launcher in print */
    .twk-panel { display: none !important; }

    /* Reveal hover-only action buttons */
    .msg-actions { opacity: 1 !important; }

    /* Disable animations/transitions */
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }

    @media print {
      @page { size: 1400px 900px; margin: 0; }
      html, body {
        width: 1400px;
        height: 900px;
        margin: 0;
        padding: 0;
        background: var(--bg);
      }
      .app { box-shadow: none; }
      .chat-scroll { overflow: visible !important; }

      /* Avoid splitting major regions across pages */
      .sidebar, .kbpanel, .chat-hd, .composer-wrap, .msg { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="src/data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/Sidebar.jsx"></script>
  <script type="text/babel" src="src/KnowledgePanel.jsx"></script>
  <script type="text/babel" src="src/Composer.jsx"></script>
  <script type="text/babel" src="src/ChatPanel.jsx"></script>
  <script type="text/babel" src="src/App.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    // Auto-print: wait until React mount + fonts ready + a small settle delay,
    // then force every <AssistantMessage> source block open so chunks print,
    // and trigger the browser print dialog.
    (async () => {
      const ready = () => new Promise((r) => {
        if (document.readyState === 'complete') r();
        else window.addEventListener('load', r, { once: true });
      });
      await ready();
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (e) {}
      }
      // Give React + Babel time to mount the tree
      await new Promise((r) => setTimeout(r, 600));

      // Force-expand each source toggle so cards are visible in print
      document.querySelectorAll('.sources-toggle').forEach((btn) => {
        const chev = btn.querySelector('.src-chev');
        const alreadyOpen = chev && chev.classList.contains('open');
        if (!alreadyOpen) btn.click();
      });

      // Give the state update a tick
      await new Promise((r) => setTimeout(r, 250));
      window.print();
    })();
  </script>
</body>
</html>
